<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVANLU</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1a0b3d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 30% 20%,
          #3b1d8f 0%,
          #2a1568 45%,
          #1a0b3d 100%
        );
      }
      #boot .spinner {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        border: 4px solid rgb(255 255 255 / 0.2);
        border-top-color: #fff;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
